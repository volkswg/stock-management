name: Migration acceptance
on:
  pull_request:
    branches: [main, codex/named-column-authority]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: migration-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked project dependencies and isolated browser tooling
        run: |
          set -euo pipefail
          npx --yes yarn@1.22.22 install --frozen-lockfile --non-interactive
          npm install --prefix "$RUNNER_TEMP/stock-browser-tools" --no-package-lock --ignore-scripts playwright@1.62.1
          test -x /usr/bin/google-chrome
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          python3 tools/native-postgres/history-copy.py "$RUNNER_TEMP/stock-pre-native-ci"
      - name: Regression, boundaries and type safety
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/evidence/regression.log"
          npm run lint 2>&1 | tee "$GITHUB_WORKSPACE/evidence/lint.log"
          npm run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/evidence/typecheck.log"
          cd "$RUNNER_TEMP/stock-pre-native-ci"
          env -i PATH="$PATH" node --test tools/migration/local-write/guard.test.cjs tools/migration/local-write/oracle.test.cjs tools/migration/local-write/binary-fixtures.test.cjs tools/migration/local-write/capacity.test.cjs tools/migration/local-write/capacity-workload.test.cjs tools/migration/local-write/capacity-context.test.cjs tools/migration/local-write/provider-outcomes.test.cjs tools/migration/local-write/legacy-fixtures.test.cjs tools/migration/local-write/browser-interception.test.cjs tools/migration/local-write/recovery-readonly.test.cjs 2>&1 | tee "$GITHUB_WORKSPACE/evidence/local-write-harness.log"
          env -i PATH="$PATH" node --test tools/migration/hosted-write/adapter.test.cjs tools/migration/hosted-write/integration.test.cjs tools/migration/hosted-write/protocol.test.cjs 2>&1 | tee "$GITHUB_WORKSPACE/evidence/hosted-adapter-offline.log"
          env -i PATH="$PATH" node tools/migration/hosted-write/inspect-packet.cjs > "$GITHUB_WORKSPACE/evidence/hosted-packet-offline.json"
          python3 -m py_compile tools/migration/local-write/capacity-observer.py tools/migration/local-write/capacity-recovery.py tools/migration/local-write/capacity-start-app.py
          python3 -m unittest discover -s tools/migration -p 'test_*.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/evidence/python.log"
      - name: Historical schema proofs and current native PostgreSQL acceptance
        working-directory: ${{ runner.temp }}/stock-pre-native-ci
        env:
          NODE_PATH: ${{ runner.temp }}/stock-browser-tools/node_modules
          STOCK_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          bash tools/migration/verify-postgres.sh 2>&1 | tee "$GITHUB_WORKSPACE/evidence/archive-postgres.log"
          env -i PATH="$PATH" node --test --test-isolation=none tools/migration/application-parity.test.cjs 2>&1 | tee "$GITHUB_WORKSPACE/evidence/application-parity.log"
          env -i PATH="$PATH" node --test tools/migration/readonly-staging.test.cjs 2>&1 | tee "$GITHUB_WORKSPACE/evidence/readonly-staging.log"
          bash tools/migration/verify-persistence-history.sh 2>&1 | tee "$GITHUB_WORKSPACE/evidence/persistence-history.log"
          bash "$GITHUB_WORKSPACE/tools/native-postgres/verify-postgres.sh" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/typed-postgres.log"
          bash tools/migration/verify-recovery-fingerprints.sh 2>&1 | tee "$GITHUB_WORKSPACE/evidence/recovery-fingerprints.log"
          bash tools/migration/verify-restricted-backup.sh 2>&1 | tee "$GITHUB_WORKSPACE/evidence/restricted-backup.log"
          STOCK_HA_EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence" bash tools/migration/verify-persistence-history.sh --hosted-tooling 2>&1 | tee "$GITHUB_WORKSPACE/evidence/hosted-tooling-integration.log"
      - name: Connection pooling and transaction safety on disposable PostgreSQL
        run: |
          set -euo pipefail
          bash tools/native-postgres/verify-pooling.sh 2>&1 | tee evidence/connection-pooling.log
      - name: Private PostgreSQL account configuration acceptance
        run: |
          set -euo pipefail
          bash tools/native-postgres/verify-accounts.sh 2>&1 | tee evidence/postgres-accounts.log
      - name: Credential-free production build and bundle boundaries
        run: |
          set -euo pipefail
          bash tools/migration/verify-build.sh 2>&1 | tee "$GITHUB_WORKSPACE/evidence/build.log"
      - name: Preserve synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-synthetic-${{ github.event.pull_request.head.sha }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
